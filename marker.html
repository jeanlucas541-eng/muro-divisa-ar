<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muro sobre a folha</title><style>body{margin:0;overflow:hidden;font-family:Arial}#panel{position:fixed;top:15px;left:15px;right:15px;padding:14px;background:#ffffffee;color:#233b4a;border-radius:12px;z-index:100}button,a{border:0;padding:10px;background:#067b94;color:white;border-radius:7px;text-decoration:none;font-size:12px;margin-right:5px}p{font-size:12px;margin:8px 0}#sceneHost{height:100dvh}#hint{font-weight:bold}</style></head><body><section id="panel"><a href="ar.html">← Voltar</a><button id="start">Ativar câmera</button><button id="mode">Mostrar armaduras</button><p id="hint">Imprima a folha A4 e mantenha o quadrado preto inteiro visível.</p><p>Safari · HTTPS · autorize a câmera quando solicitado.</p></section><div id="sceneHost"></div><script>
const hint=document.querySelector('#hint');let steel=false,started=false;
function load(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.append(s);});}
document.querySelector('#start').onclick=async()=>{if(started)return;if(!isSecureContext){hint.textContent='A câmera precisa do endereço HTTPS. O HTTP da rede local não funciona no iPhone.';return;}try{hint.textContent='Carregando a experiência…';await load('./vendor/aframe.min.js');await load('./vendor/aframe-ar.js');document.querySelector('#sceneHost').innerHTML=`<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; cameraParametersUrl: ./marker/camera_para.dat;" renderer="logarithmicDepthBuffer: true;" vr-mode-ui="enabled: false"><a-assets><a-asset-item id="wall" src="muro-maquete.glb"></a-asset-item><a-asset-item id="bars" src="armaduras-maquete.glb"></a-asset-item></a-assets><a-marker id="target" type="pattern" url="./marker/patt.hiro" size=".14" emitevents="true" smooth="true"><a-entity id="wallModel" gltf-model="#wall" scale="1 1 1"></a-entity><a-entity id="steelModel" gltf-model="#bars" scale="1 1 1" visible="false"></a-entity></a-marker><a-entity camera></a-entity></a-scene>`;document.querySelector('#target').addEventListener('markerFound',()=>hint.textContent='Marcador encontrado. Mova o iPhone lentamente.');document.querySelector('#target').addEventListener('markerLost',()=>hint.textContent='Aponte para o quadrado preto inteiro novamente.');started=true;hint.textContent='Autorize a câmera e aponte para o marcador da folha.';}catch(e){hint.textContent='Não foi possível iniciar. Confira a conexão e a permissão de câmera no Safari.';}};
document.querySelector('#mode').onclick=()=>{steel=!steel;document.querySelector('#mode').textContent=steel?'Mostrar muro completo':'Mostrar armaduras';document.querySelector('#wallModel')?.setAttribute('visible',!steel);document.querySelector('#steelModel')?.setAttribute('visible',steel);};
</script></body></html>
